<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus Screen – Customize</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
a{color:#FFC627}a:hover{color:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #FFC627;outline-offset:3px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Arial, Helvetica, sans-serif; padding: 32px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="Main.dc.html" aria-label="Back to Focus Screen" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #191919; border: 1px solid #484848; color: #FFFFFF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 40px; font-weight: 700">Customize</h1>
</div>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 999px; background: {{accent}}; color: #000000; font-weight: 700; text-decoration: none; font-size: 16px">Done</a>
</header>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-label="Theme" style="flex: 1 1 380px; min-width: 0; background: #191919; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 22px">Theme</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 16px; border: 2px solid {{t.ring}}; background: #000000; color: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
<span aria-hidden="true" style="display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 72px; border-radius: 10px; padding: 10px; box-sizing: border-box; background: {{t.bg}}; border: 1px solid #2a2a2a">
<span style="width: 60%; height: 8px; border-radius: 4px; background: {{t.card}}"></span>
<span style="width: 35%; height: 8px; border-radius: 4px; background: {{t.accent}}"></span>
</span>
<span style="font-size: 15px">{{t.label}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; color: #BFBFBF">Background</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{bgModes}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; cursor: pointer">{{o.label}}</button></sc-for>
</div>
</div>
</section>
<section aria-label="Widgets" style="flex: 1 1 380px; min-width: 0; background: #191919; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 10px 0; font-size: 22px">Widgets on screen</h2>
<sc-for list="{{widgets}}" as="w" hint-placeholder-count="6">
<button onClick="{{w.toggle}}" aria-pressed="{{w.on}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; border: none; border-bottom: 1px solid #2a2a2a; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 16px; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span>{{w.label}}</span><span style="font-size: 13px; color: #BFBFBF">{{w.hint}}</span></span>
<span aria-hidden="true" style="flex: 0 0 auto; position: relative; width: 48px; height: 28px; border-radius: 999px; background: {{w.track}}"><span style="position: absolute; top: 3px; left: {{w.knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
</section>
<section aria-label="Timer settings" style="flex: 1 1 380px; min-width: 0; background: #191919; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 22px">Timer</h2>
<sc-for list="{{timerGroups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; color: #BFBFBF">{{g.label}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; cursor: pointer">{{o.label}}</button></sc-for>
</div>
</div>
</sc-for>
<sc-for list="{{timerToggles}}" as="w" hint-placeholder-count="2">
<button onClick="{{w.toggle}}" aria-pressed="{{w.on}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; border: none; border-top: 1px solid #2a2a2a; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 16px; text-align: left; cursor: pointer">
<span>{{w.label}}</span>
<span aria-hidden="true" style="flex: 0 0 auto; position: relative; width: 48px; height: 28px; border-radius: 999px; background: {{w.track}}"><span style="position: absolute; top: 3px; left: {{w.knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
</section>
<section aria-label="Music settings" style="flex: 1 1 380px; min-width: 0; background: #191919; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 22px">Music</h2>
<sc-for list="{{musicGroups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; color: #BFBFBF">{{g.label}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; cursor: pointer">{{o.label}}</button></sc-for>
</div>
</div>
</sc-for>
<sc-for list="{{musicToggles}}" as="w" hint-placeholder-count="2">
<button onClick="{{w.toggle}}" aria-pressed="{{w.on}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; border: none; border-top: 1px solid #2a2a2a; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 16px; text-align: left; cursor: pointer">
<span>{{w.label}}</span>
<span aria-hidden="true" style="flex: 0 0 auto; position: relative; width: 48px; height: 28px; border-radius: 999px; background: {{w.track}}"><span style="position: absolute; top: 3px; left: {{w.knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
</section>
<section aria-label="To-do sources" style="flex: 1 1 380px; min-width: 0; background: #191919; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 10px 0; font-size: 22px">To-do sources</h2>
<sc-for list="{{sources}}" as="src" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 14px; min-height: 60px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; background: {{src.color}}"></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">{{src.label}}</span><span style="font-size: 13px; color: #BFBFBF">{{src.status}}</span></span>
<button onClick="{{src.toggle}}" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{src.border}}; background: {{src.bg}}; color: {{src.fg}}; font-family: inherit; font-size: 14px; cursor: pointer">{{src.action}}</button>
</div>
</sc-for>
</section>
<section aria-label="Display" style="flex: 1 1 380px; min-width: 0; background: #191919; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 22px">Display</h2>
<sc-for list="{{displayGroups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; color: #BFBFBF">{{g.label}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; cursor: pointer">{{o.label}}</button></sc-for>
</div>
</div>
</sc-for>
<sc-for list="{{displayToggles}}" as="w" hint-placeholder-count="3">
<button onClick="{{w.toggle}}" aria-pressed="{{w.on}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; border: none; border-top: 1px solid #2a2a2a; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 16px; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span>{{w.label}}</span><span style="font-size: 13px; color: #BFBFBF">{{w.hint}}</span></span>
<span aria-hidden="true" style="flex: 0 0 auto; position: relative; width: 48px; height: 28px; border-radius: 999px; background: {{w.track}}"><span style="position: absolute; top: 3px; left: {{w.knob}}; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC627","options":["#FFC627","#4AB7C4","#FF7F32","#78BE20"]},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = {
      theme: "night", bgMode: "solid",
      wMusic: true, wTodo: true, wTimer: true, wClock: true, wClass: false, wWeather: false,
      tStyle: "ring", tDir: "down", tFocus: 25, tBreak: 5, tSound: true, tAuto: false,
      lyrics: "synced", disc: "normal", mLyrics: true, mArtColors: true,
      srcCanvas: true, srcGoogle: true, srcRem: true, srcMs: false, srcTodoist: false,
      screen: "d2", idle: 5, burn: true, onTop: true, hideCursor: true
    };
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? "#FFC627";
    const pill = (key, v, label) => {
      const on = s[key] === v;
      return { label, on, pick: () => this.setState({ [key]: v }), bg: on ? accent : "transparent", fg: on ? "#000000" : "#FFFFFF", border: on ? accent : "#484848" };
    };
    const tog = (key, label, hint) => {
      const on = !!s[key];
      return { label, hint: hint || "", on, toggle: () => this.setState({ [key]: !this.state[key] }), track: on ? accent : "#484848", knob: on ? "23px" : "3px" };
    };
    const themeDefs = [
      ["night", "Sun Devil Night", "#000000", "#191919", "#FFC627"],
      ["maroon", "Maroon & Gold", "#5a1229", "#8C1D40", "#FFC627"],
      ["day", "Daylight", "#E8E8E8", "#FFFFFF", "#8C1D40"],
      ["oled", "OLED Dim", "#000000", "#0d0d0d", "#747474"]
    ];
    const themes = themeDefs.map(([v, label, bg, card, acc]) => ({
      label, bg, card, accent: acc, on: s.theme === v, ring: s.theme === v ? accent : "#2a2a2a",
      pick: () => this.setState({ theme: v })
    }));
    const srcDefs = [
      ["srcCanvas", "Canvas", "#FF7F32", "Assignments and planner items", "Connected"],
      ["srcGoogle", "Google Tasks", "#78BE20", "Two-way sync", "Connected"],
      ["srcRem", "Apple Reminders", "#00A3E0", "Mac only", "Connected"],
      ["srcMs", "Microsoft To Do", "#4AB7C4", "Two-way sync", "Not connected"],
      ["srcTodoist", "Todoist", "#E74973", "Two-way sync", "Not connected"]
    ];
    const sources = srcDefs.map(([key, label, color, note, _]) => {
      const on = !!s[key];
      return {
        label, color, status: (on ? "Connected · " : "Not connected · ") + note,
        action: on ? "Disconnect" : "Connect",
        bg: on ? "transparent" : accent, fg: on ? "#FFFFFF" : "#000000", border: on ? "#484848" : accent,
        toggle: () => this.setState({ [key]: !this.state[key] })
      };
    });
    return {
      accent, themes,
      bgModes: [pill("bgMode", "solid", "Solid"), pill("bgMode", "art", "Blur album art"), pill("bgMode", "photo", "Your photo")],
      widgets: [
        tog("wMusic", "Now playing", "Disc, controls, lyrics"),
        tog("wTodo", "To-do list", "Canvas, Reminders, Google Tasks"),
        tog("wTimer", "Timer", "Pomodoro, countdown, stopwatch"),
        tog("wClock", "Clock and date", "Top bar"),
        tog("wClass", "Next class", "Countdown to your next calendar event"),
        tog("wWeather", "Weather", "Current temp and conditions")
      ],
      timerGroups: [
        { label: "Style", opts: [pill("tStyle", "ring", "Ring"), pill("tStyle", "bar", "Bar"), pill("tStyle", "flip", "Flip digits"), pill("tStyle", "sand", "Sand timer")] },
        { label: "Direction", opts: [pill("tDir", "down", "Count down"), pill("tDir", "up", "Count up")] },
        { label: "Focus length", opts: [pill("tFocus", 25, "25 min"), pill("tFocus", 45, "45 min"), pill("tFocus", 50, "50 min"), pill("tFocus", 0, "Custom")] },
        { label: "Break length", opts: [pill("tBreak", 5, "5 min"), pill("tBreak", 10, "10 min"), pill("tBreak", 15, "15 min")] }
      ],
      timerToggles: [tog("tSound", "Chime when time is up"), tog("tAuto", "Auto-start breaks")],
      musicGroups: [
        { label: "Lyrics", opts: [pill("lyrics", "synced", "Synced"), pill("lyrics", "full", "Full text"), pill("lyrics", "off", "Off")] },
        { label: "Disc spin", opts: [pill("disc", "slow", "Slow"), pill("disc", "normal", "Normal"), pill("disc", "off", "Still")] }
      ],
      musicToggles: [tog("mArtColors", "Match accent to album art"), tog("mLyrics", "Show player name")],
      sources,
      displayGroups: [
        { label: "Show on", opts: [pill("screen", "d1", "Display 1"), pill("screen", "d2", "Display 2"), pill("screen", "win", "Floating window")] },
        { label: "Dim when idle after", opts: [pill("idle", 5, "5 min"), pill("idle", 15, "15 min"), pill("idle", 0, "Never")] }
      ],
      displayToggles: [
        tog("burn", "Burn-in protection", "Shifts the layout a few pixels over time"),
        tog("onTop", "Keep on top", "Stays above other windows on that screen"),
        tog("hideCursor", "Hide cursor", "When the mouse rests on the Focus Screen")
      ]
    };
  }
}
</script>
</body>
</html>
